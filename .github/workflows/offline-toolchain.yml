name: Snapshot offline build tools

on:
  push:
    branches: [build/boreal-snapshot-20260928-toolchain]
    paths: [.github/workflows/offline-toolchain.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vendor exact dependencies of uploaded snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p offline/bootstrap/src
          cat > offline/bootstrap/Cargo.toml <<'TOML'
          [package]
          name = "boreal-offline-tools"
          version = "0.0.0"
          edition = "2021"
          [workspace]
          [dependencies]
          serde = { version = "=1.0.229", features = ["derive"] }
          serde_json = "=1.0.151"
          serde_core = "=1.0.229"
          serde_derive = "=1.0.229"
          itoa = "=1.0.18"
          memchr = "=2.8.3"
          proc-macro2 = "=1.0.107"
          quote = "=1.0.47"
          syn = "=3.0.5"
          unicode-ident = "=1.0.24"
          zmij = "=1.0.23"
          TOML
          echo 'fn main() {}' > offline/bootstrap/src/main.rs
          cargo generate-lockfile --manifest-path offline/bootstrap/Cargo.toml
          cargo vendor --manifest-path offline/bootstrap/Cargo.toml --locked offline/vendor
          (cd offline && npm pack typescript@5.4.5)
      - name: Archive portable tools without credentials or machine caches
        shell: bash
        run: |
          set -euo pipefail
          sysroot="$(rustc --print sysroot)"
          mkdir -p offline/toolchain
          rsync -a --exclude='share/doc' --exclude='share/man' "$sysroot/" offline/toolchain/
          { rustc -vV; cargo -V; rustfmt -V; cargo clippy -V; node -v; echo 'Source input archive SHA-256: e1c7cf403131832a5d0b52a68274931ddaad2372361bf1abcb04814ad8f0e136'; } > offline/BUILD-TOOLS.txt
          tar -czf boreal-offline-toolchain.tar.gz -C offline toolchain vendor typescript-5.4.5.tgz BUILD-TOOLS.txt
          sha256sum boreal-offline-toolchain.tar.gz > boreal-offline-toolchain.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: boreal-offline-toolchain-linux-x86_64
          path: |
            boreal-offline-toolchain.tar.gz
            boreal-offline-toolchain.sha256
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
