name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned TUI compiler
        run: npm install --global typescript@5.4.5
      - name: Build release archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/release/build_release.py \
            --version "${RELEASE_VERSION#v}" \
            --target "${{ matrix.target }}" \
            --output-dir release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-artifacts
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-releases
      - name: Assemble release assets
        run: |
          mkdir -p upload
          find downloaded-releases -type f \( -name '*.tar.gz' -o -name '*.release.json' \) -exec cp {} upload/ \;
          find upload -type f -name '*.tar.gz' -print0 | sort -z | xargs -0 sha256sum > upload/SHA256SUMS
          test -s upload/SHA256SUMS
          ls -lh upload
      - name: Render Homebrew formula
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/release/render_homebrew_formula.py \
            --version "${RELEASE_VERSION#v}" \
            --archive "aarch64-apple-darwin=$(find upload -name '*aarch64-apple-darwin.tar.gz' -print -quit)" \
            --archive "x86_64-apple-darwin=$(find upload -name '*x86_64-apple-darwin.tar.gz' -print -quit)" \
            --archive "x86_64-unknown-linux-gnu=$(find upload -name '*x86_64-unknown-linux-gnu.tar.gz' -print -quit)" \
            --output upload/boreal.rb
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" upload/* --title "Boreal $GITHUB_REF_NAME" --generate-notes
