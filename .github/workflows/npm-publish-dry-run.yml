name: npm publish dry run

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  npm-publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx --yes playwright@1.61.1 install --with-deps chromium
      - run: pnpm check
      - run: pnpm test
      - run: pnpm ci:doctor:strict
      - run: pnpm release:npm:smoke
      - run: pnpm release:npm:dry-run
