name: upgrade release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: upgrade-release-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BOREAL_INSTALL_CHANNEL: github
      - name: Verify release tag
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      - run: node node_modules/vitest/vitest.mjs run tests/runtime/update-release.test.ts tests/runtime/update-install.test.ts tests/runtime/upgrade-command.test.ts tests/tools/package-upgrade-release.test.ts
      - run: node tools/package-upgrade-release.mjs --out .boreal/release
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-release
          path: .boreal/release
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-release
          path: .boreal/release
      - name: Verify prebuilt upgrade artifact
        shell: bash
        run: |
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf .boreal/release/bwrk-upgrade.tar.gz -C "$stage"
          test -x "$stage/apps/cli/dist/index.js"
          test -x "$stage/install.sh"
          node "$stage/apps/cli/dist/index.js" --no-delegate --version --json
          node "$stage/apps/cli/dist/index.js" dashboard --help

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: upgrade-release
          path: .boreal/release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          tag="v$version"
          if existing_draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$existing_draft" = "true" ]; then
              gh release upload "$tag" .boreal/release/bwrk-upgrade.tar.gz .boreal/release/SHA256SUMS .boreal/release/bwrk-release.json --clobber
              gh release edit "$tag" --draft=false --latest=true
            else
              echo "Release already published; leaving its assets and latest pointer untouched."
            fi
            exit 0
          fi
          gh release create "$tag" \
            .boreal/release/bwrk-upgrade.tar.gz \
            .boreal/release/SHA256SUMS \
            .boreal/release/bwrk-release.json \
            --target "$GITHUB_SHA" \
            --title "Boreal ${tag}" \
            --notes "Verified Boreal release bundle for ${tag}." \
            --draft \
            --latest=false
          gh release edit "$tag" --draft=false --latest=true
