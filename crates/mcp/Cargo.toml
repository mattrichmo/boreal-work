[package]
name = "boreal-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Scoped MCP adapters for Boreal's existing local services"

# This adapter is intentionally kept outside the workspace until the CLI and
# integration owners accept the shared manifest/command wiring.
[workspace]

[dependencies]
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls"] }
boreal-protocol = { path = "../protocol" }
boreal-service = { path = "../service" }
futures-util = "0.3"
http = "1"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["form", "rustls", "stream"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["macros", "server", "schemars", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "=1.2.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.9"
tower = { version = "0.5", features = ["limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = { version = "2.5", features = ["serde"] }
